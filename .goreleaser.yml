version: 2

project_name: linode-tui

before:
  hooks:
    - go mod tidy

builds:
  - id: linode-tui
    main: ./cmd/linode-tui
    binary: linode-tui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - AGENTS*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.json"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: luthermonson
    name: linode-tui
  draft: true
  prerelease: auto

# Homebrew tap publishing is disabled until a token that can push to the
# separate luthermonson/homebrew-tap repo is available. The default
# secrets.GITHUB_TOKEN is scoped to this repo only and cannot push there, so an
# active brews block would fail the release at the tap step. To re-enable:
#   1. Create a PAT (classic `repo`, or fine-grained contents:write on the tap
#      repo) and add it as the repo secret HOMEBREW_TAP_TOKEN — the release
#      workflow already prefers it over GITHUB_TOKEN.
#   2. Uncomment the block below. Note: `brews` is deprecated in favor of
#      `homebrew_casks`; consider migrating at the same time.
# brews:
#   - repository:
#       owner: luthermonson
#       name: homebrew-tap
#     homepage: https://github.com/luthermonson/linode-tui
#     description: A k9s-inspired TUI for the Linode API
#     license: MIT
#     install: |
#       bin.install "linode-tui"
#     test: |
#       system "#{bin}/linode-tui", "version"
